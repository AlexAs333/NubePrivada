version: '3.8'

services:
  # Servicio de Base de Datos
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nube_privada
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servicio de tu API Node.js
  api:
    build: .
    container_name: node_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_NAME: nube_privada
      DB_USER: admin
      DB_PASSWORD: password123
      DB_HOST: db
      PORT: 3000
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data: